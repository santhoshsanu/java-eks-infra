# ══════════════════════════════════════════════════════════════════════════════
#  Infrastructure Pipeline — Terraform
#  Manages: VPC, EKS, ECR, IAM, OIDC
#
#  Triggers:
#  1. Push to any branch       → plan only (no apply)
#  2. Push/merge to main       → plan + apply
#  3. Manual (workflow_dispatch) → choose: plan / apply / destroy
# ══════════════════════════════════════════════════════════════════════════════

name: Infrastructure Pipeline

on:
  # ── Auto trigger — only when terraform files change ────────────────────────
  push:
    paths:
      - 'terraform/**'
      - 'monitoring/**'

  # ── Manual trigger — run from GitHub Actions UI ────────────────────────────
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: 'Type DESTROY to confirm destruction of all infrastructure'
        required: false
        type: string

# ── Global environment variables ──────────────────────────────────────────────
env:
  AWS_REGION:       ap-south-1
  TF_WORKING_DIR:   terraform
  TF_VERSION:       1.7.5

jobs:

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 1 — TERRAFORM PLAN
#  Runs on: every push to any branch + manual plan/apply/destroy trigger
# ══════════════════════════════════════════════════════════════════════════════
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    # Skip plan job if manual action is destroy (go straight to destroy job)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM INIT =========="
          terraform init
          echo "✅ Init complete"

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM FORMAT CHECK =========="
          terraform fmt -check -recursive
          echo "✅ Format check passed"
        continue-on-error: true   # warn but don't fail pipeline

      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM VALIDATE =========="
          terraform validate
          echo "✅ Validation passed"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM PLAN =========="
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -input=false
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          echo "✅ Plan complete"
        continue-on-error: true   # capture exit code without failing

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_number }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Plan Summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "════════════════════════════════════════"
          echo "  Terraform Plan Summary"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Run Number : ${{ github.run_number }}"
          echo "  Plan Exit  : ${{ steps.plan.outputs.exitcode }}"
          echo "  0 = No changes"
          echo "  1 = Error"
          echo "  2 = Changes detected"
          echo "════════════════════════════════════════"

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 2 — TERRAFORM APPLY
#  Runs on: push to main OR manual apply trigger
#  Requires: terraform-plan job to succeed first
# ══════════════════════════════════════════════════════════════════════════════
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan

    # Only apply on main branch push OR manual apply trigger
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_number }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM APPLY =========="
          terraform apply -input=false tfplan
          echo "✅ Apply complete"

      - name: Print Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM OUTPUTS =========="
          terraform output
        continue-on-error: true

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 3 — DEPLOY MONITORING STACK
#  Runs after terraform-apply — deploys OTEL + Prometheus + Grafana to EKS
# ══════════════════════════════════════════════════════════════════════════════
  deploy-monitoring:
    name: "Deploy Monitoring Stack"
    runs-on: ubuntu-latest
    needs: terraform-apply

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name java-eks-cluster
          kubectl get nodes
          echo "✅ kubectl configured"

      - name: Deploy Monitoring Stack
        run: |
          echo "========== DEPLOYING MONITORING STACK =========="

          # Create monitoring namespace first
          kubectl apply -f monitoring/namespace.yaml
          echo "✅ Namespace created"

          # Wait for namespace to be ready
          sleep 5

          # Deploy OTEL Collector
          kubectl apply -f monitoring/otel-collector.yaml
          echo "✅ OTEL Collector deployed"

          # Deploy Prometheus
          kubectl apply -f monitoring/prometheus.yaml
          echo "✅ Prometheus deployed"

          # Deploy Grafana
          kubectl apply -f monitoring/grafana.yaml
          echo "✅ Grafana deployed"

      - name: Wait for monitoring pods
        continue-on-error: true   # don't fail pipeline if grafana is slow
        run: |
          echo "⏳ Waiting for monitoring pods..."
          kubectl rollout status deployment/otel-collector -n monitoring --timeout=180s
          kubectl rollout status deployment/prometheus -n monitoring --timeout=180s
          kubectl rollout status deployment/grafana -n monitoring --timeout=300s
          echo "✅ All monitoring pods running"

      - name: Print monitoring status
        run: |
          echo "════════════════════════════════════════"
          echo "  Monitoring Stack Status"
          kubectl get pods -n monitoring
          echo ""
          echo "  Grafana URL:"
          kubectl get svc grafana -n monitoring
          echo "════════════════════════════════════════"

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 4 — TERRAFORM DESTROY
#  Runs on: manual trigger with action=destroy ONLY
#  Requires: production environment approval (you must click approve)
# ══════════════════════════════════════════════════════════════════════════════
  terraform-destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest

    # ── Production environment — requires your manual approval ────────────────
    environment: production

    # Only runs on manual destroy trigger with confirmation
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'DESTROY'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Delete K8s namespaces first (releases ALB + EIPs)
        run: |
          echo "========== DELETING K8S NAMESPACES =========="
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name java-eks-cluster || true

          kubectl delete namespace product-catalog --ignore-not-found=true
          kubectl delete namespace monitoring --ignore-not-found=true

          echo "⏳ Waiting 60s for ALB and EIPs to be released..."
          sleep 60
          echo "✅ Namespaces deleted"
        continue-on-error: true

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== TERRAFORM DESTROY =========="
          echo "⚠️  Destroying ALL infrastructure..."
          terraform destroy -auto-approve -input=false
          echo "✅ Destroy complete — all resources deleted"

      - name: Destroy Summary
        run: |
          echo "════════════════════════════════════════"
          echo "  Infrastructure Destroyed"
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Run Number   : ${{ github.run_number }}"
          echo "  Time         : $(date)"
          echo "  All EKS, ECR, VPC resources deleted"
          echo "  S3 state bucket preserved"
          echo "════════════════════════════════════════"
